name: corners_collector

# Corners A/B/C prospective dataset (research only; pre-registered research/platform_v2/corners_abc/PREREGISTRATION.md).
# Zero API credits: fixtures and results from football-data.co.uk. Writes corners-A-1.0 predictions for the 10 leagues'
# fixtures in the next 7 days and outcomes of predicted events, to research_shadow/corners/ only. No price adapter is
# enabled (market_status = NO_PRICE_SOURCE_ENABLED). Never touches the ledger, Stage A, bet selection or the Money Card.
# Own concurrency group and own files, so its commits can never conflict with production pushes.

on:
  schedule:
    - cron: "41 7 * * *"
  workflow_dispatch:
  push:
    branches: ["engines-c3"]     # TEMPORARY: first-run validation before merge; removed before merging

permissions:
  contents: write

concurrency:
  group: prediction-markets-lab-corners-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -e .
      - name: Module tests
        run: pytest -q tests/unit/test_corners_collector.py
      - name: Collect
        run: python scripts/run_corners_collector.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add research_shadow/corners/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No corners collector changes"
          else
            git commit -m "Corners collector: $(date -u +%FT%H:%MZ) (research only)"
            for i in 1 2 3; do git pull --rebase && git push && break; sleep 10; done
          fi

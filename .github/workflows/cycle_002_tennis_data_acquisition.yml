name: Cycle 2 Tennis Data Acquisition

# Manually triggered ONLY. Never runs on push or a schedule -- same
# bounded, one-shot research-job rationale as
# cycle_001_data_acquisition.yml (project instructions: architecture
# freeze permits this only because it solves a proven, named research
# requirement -- obtaining the full historical dataset without
# requiring a laptop -- not as general-purpose CI/CD). Needed because
# both the cloud research sandbox and this project's own development
# machine are proxy-blocked from raw.githubusercontent.com and
# tennis-data.co.uk (confirmed 2026-09-11); GitHub's own runners have
# unrestricted internet access to both.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Plan the run without downloading anything"
        type: boolean
        default: false
      tours:
        description: "Comma-separated tour codes (blank = all: ATP,WTA)"
        type: string
        default: ""
      seasons:
        description: "Comma-separated seasons (blank = all 5 target seasons)"
        type: string
        default: ""
      request_delay_seconds:
        description: "Seconds between requests (conservative default)"
        type: string
        default: "6"
      max_retries:
        description: "Retries per failing source before giving up (lower this for a fast diagnostic pass -- each failing source costs up to ~5 min at the default of 4)"
        type: string
        default: "4"
      resume_existing:
        description: "Skip files already present on disk without re-fetching"
        type: boolean
        default: true

permissions:
  contents: read

env:
  # Python fully buffers stdout when it isn't attached to a real
  # terminal (exactly the case for a GitHub Actions log capture), so
  # without this every print() from the acquisition script -- the
  # per-target "fetching..."/"FAILED: ..." progress lines that matter
  # most for watching a long, paced, retrying run live -- sits
  # invisible in a buffer instead of streaming to the log as it
  # happens. Discovered on the first real run (run #3): the log stayed
  # blank past the shell env dump for 20+ minutes while the script was
  # (as far as we could tell after the fact) actually working through
  # its bounded retry/backoff loop.
  PYTHONUNBUFFERED: "1"

jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Diagnostic only, never fails the job: the first two real runs
      # (2026-09-11) got a uniform HTTP 404 on every single Sackmann
      # file from this runner, which a retry-loop bug (fixed alongside
      # this step -- see tennis_data_loader.py's HttpClient._get_raw)
      # made look like ~2.5 minutes of retries per file instead of an
      # instant failure. Before spending the full paced acquisition run
      # finding that out again, ask this exact runner directly, in
      # seconds, what raw.githubusercontent.com and the GitHub API
      # actually say about JeffSackmann/tennis_atp right now.
      # The prior run's diagnostic (git ls-remote + api.github.com) came
      # back with a clean "Repository not found" for both
      # JeffSackmann/tennis_atp and /tennis_wta -- not a rate limit,
      # not a wrong branch name. The repos genuinely do not exist at
      # that path any more. This step checks whether the account still
      # exists and searches GitHub for whatever tennis-named repos it
      # actually owns now, so config/cycle_002_tennis_data.yaml can be
      # pointed at the real current location instead of guessing again.
      - name: Find where JeffSackmann's tennis repos actually live now
        run: python3 scripts/_diagnose_sackmann_repos.py
        continue-on-error: true

      # Pinned to 3.12 (not 3.11, unlike this project's other workflows)
      # specifically for this job: tennis_data_loader.py's
      # build_legacy_tolerant_ssl_context() applies three independent
      # TLS-compatibility relaxations for Tennis-data.co.uk's legacy
      # server, but the third -- ssl.OP_LEGACY_SERVER_CONNECT -- was
      # only added to Python's ssl module in 3.12 and is looked up via
      # getattr(ssl, "OP_LEGACY_SERVER_CONNECT", 0), so on 3.11 it
      # silently no-ops. Real run 2026-09-13 (workflow run 34766536563)
      # confirmed all 5 Tennis-data.co.uk fetches still fail with the
      # identical `[SSL: TLSV1_ALERT_INTERNAL_ERROR]` on 3.11 -- i.e.
      # only 2 of the function's 3 documented mitigations have ever
      # actually executed on this runner. This is the one remaining
      # untested piece of the "final sensible TLS compatibility
      # attempt" the project's acquisition rules call for before
      # falling back to the manual-download importer
      # (scripts/import_manual_tennis_data_co_uk_files.py, already
      # built and tested) -- not a new workaround, just letting the
      # existing, already-written fix actually run. TML-Database
      # (raw.githubusercontent.com) succeeded on 3.11 already and is
      # unaffected either way. requires-python in pyproject.toml is
      # ">=3.11", so this is a safe bump for this one job.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -e .

      - name: Run the complete test suite first
        run: pytest -q

      - name: Build acquisition command
        id: build_cmd
        run: |
          CMD="python scripts/run_cycle_002_tennis_data_acquisition.py"
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            CMD="$CMD --dry-run"
          fi
          if [ "${{ inputs.resume_existing }}" = "true" ]; then
            CMD="$CMD --resume"
          fi
          if [ -n "${{ inputs.tours }}" ]; then
            IFS=',' read -ra TOURS <<< "${{ inputs.tours }}"
            for t in "${TOURS[@]}"; do CMD="$CMD --tour $t"; done
          fi
          if [ -n "${{ inputs.seasons }}" ]; then
            IFS=',' read -ra SEASONS <<< "${{ inputs.seasons }}"
            for s in "${SEASONS[@]}"; do CMD="$CMD --season $s"; done
          fi
          CMD="$CMD --request-delay-seconds ${{ inputs.request_delay_seconds }}"
          CMD="$CMD --max-retries ${{ inputs.max_retries }}"
          echo "cmd=$CMD" >> "$GITHUB_OUTPUT"

      # Diagnostic only, never fails the job: confirms in the log,
      # rather than assuming, whether this runner's Python/OpenSSL
      # build actually exposes ssl.OP_LEGACY_SERVER_CONNECT -- the
      # mitigation this job was bumped to Python 3.12 for (see the
      # comment on "Set up Python" above). If this ever prints False
      # again on a runner that's supposed to be 3.12+, that's a signal
      # the version bump didn't take effect, not that the TLS fix
      # itself is wrong.
      - name: Confirm the legacy-TLS mitigation is actually available on this runner
        run: |
          python3 -c "
          import ssl
          print('Python:', __import__('sys').version)
          print('OpenSSL:', ssl.OPENSSL_VERSION)
          print('OP_LEGACY_SERVER_CONNECT available:', hasattr(ssl, 'OP_LEGACY_SERVER_CONNECT'))
          "
        continue-on-error: true

      - name: Run acquisition (paced, may take several minutes)
        run: ${{ steps.build_cmd.outputs.cmd }}

      - name: Validate the acquired bundle
        if: ${{ inputs.dry_run != 'true' }}
        run: python scripts/validate_cycle_002_tennis_data_bundle.py

      - name: Upload manifest, schema inventory, and data version (small, always uploaded)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cycle_002-tennis-manifest-and-version
          path: |
            reports/audits/tennis_data_manifest.csv
            reports/audits/tennis_data_schema_inventory.json
            data/processed/tennis/cycle_002_data_version.json
          if-no-files-found: warn

      # Raw historical files are NOT committed to the repository (same
      # policy as Cycle 1's football data, see
      # research/cycles/CYCLE_001/DECISION_LOG.md) -- preserved only as
      # a workflow artifact, to avoid repository bloat and to respect
      # the Sackmann repos' non-commercial license (redistributing the
      # raw files via a public artifact download is a separate
      # licensing question from using them for private research; keep
      # this artifact's retention short and treat it as a working copy,
      # not a redistribution channel).
      - name: Upload raw source files
        if: ${{ inputs.dry_run != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: cycle_002-tennis-raw-files
          path: data/raw/tennis/**
          if-no-files-found: warn
          retention-days: 90

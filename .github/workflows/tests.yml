name: tests

# 2026-09-19 fix (Daily Engine V1 audit, "MAJOR NEXT PHASE" instruction
# Phase 4): this workflow triggered on branches: [main], but the repo's
# actual default (and only) branch is `master` -- confirmed via
# `git symbolic-ref refs/remotes/origin/HEAD`. That mismatch meant this
# CI test workflow almost certainly never ran on a real push or PR.
# Corrected to master; behaviour is otherwise unchanged.
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -e .
      - name: Run tests
        run: pytest --cov=prediction_markets_lab

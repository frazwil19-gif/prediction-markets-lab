name: ci

# Full test suite in a clean environment on every push to a non-master branch and on pull requests, so a branch's
# status is visible BEFORE it is merged. (Production workflows additionally run pytest before acting.)
on:
  push:
    branches-ignore: ["master"]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          pip install -r requirements.txt
          pip install -e .
      - run: pytest -q

name: prop_price_probe

# ONE-SHOT, approved 2026-10-02 (<=2 credits). Runs only on pushes to the probe branch; the script refuses to call
# the API again once research_shadow/prop_price_probe/result.json exists (bot pushes via GITHUB_TOKEN never re-trigger).
on:
  push:
    branches: ["probe/prop-price-c1"]

permissions:
  contents: write

concurrency:
  group: prop-price-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          pip install -r requirements.txt
          pip install -e .
      - name: Probe (single paid call, <=2 credits)
        env:
          THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
        run: python scripts/prop_price_probe.py
      - name: Commit result
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add research_shadow/prop_price_probe/ 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "Prop price probe result (single approved call)"
            git push
          fi

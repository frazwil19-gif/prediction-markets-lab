name: tennis_prediction_board

# Phase V2-2 (2026-09-23): PAPER tennis Prediction Board + settlement. Research only --
# no stakes, no Money Card, no bankroll. Protocol:
# research/platform_v2/tennis_prospective/ATP_PROSPECTIVE_PROTOCOL.md
# Credits: /sports is free; 1 credit per active covered tennis key per scan (regions=uk,
# markets=h2h); a guard in the script stops tennis fetches below 150 remaining credits
# so the football scan's budget is protected. Settlement uses free published results.

on:
  schedule:
    - cron: "30 6 * * *"   # morning board (Europe/Asia sessions)
    - cron: "30 15 * * *"  # afternoon board (picks up newly scheduled Americas matches)
    - cron: "30 22 * * *"  # settlement + performance (no API credits)
  workflow_dispatch:
    inputs:
      mode:
        description: "board or settle"
        type: choice
        options: [board, settle]
        default: board

permissions:
  contents: write

concurrency:
  group: prediction-markets-lab-production
  cancel-in-progress: false

jobs:
  tennis:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Record workflow start (V2-5 timing evidence)
        run: echo "WORKFLOW_START=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -e .
      - name: Run the test suite first
        id: tests
        run: pytest -q
      - name: Board
        if: (github.event_name == 'schedule' && github.event.schedule != '30 22 * * *') || (github.event_name == 'workflow_dispatch' && inputs.mode == 'board')
        env:
          THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
          TRIGGER_EVENT: ${{ github.event_name }}
          TRIGGER_SCHEDULE: ${{ github.event.schedule }}
          RUN_ID: ${{ github.run_id }}
        run: python scripts/run_tennis_prediction_board.py
      - name: Settle
        if: (github.event_name == 'schedule' && github.event.schedule == '30 22 * * *') || (github.event_name == 'workflow_dispatch' && inputs.mode == 'settle')
        run: python scripts/run_tennis_settlement.py
      - name: Unified Prediction Board -- tennis mirror + NBA (V2-5 paper; NBA inactive until 2026-10-20)
        if: always() && steps.tests.outcome == 'success'
        continue-on-error: true
        env:
          THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
          TRIGGER_EVENT: ${{ github.event_name }}
          TRIGGER_SCHEDULE: ${{ github.event.schedule }}
        run: |
          git fetch -q origin master && (git checkout origin/master -- predictions/ 2>/dev/null || true)
          python scripts/run_unified_prediction_board.py ingest-tennis --ci-passed
          if [ "${{ github.event.schedule }}" = "30 22 * * *" ] || [ "${{ inputs.mode }}" = "settle" ]; then
            python scripts/run_unified_prediction_board.py settle
          else
            python scripts/run_unified_prediction_board.py collect-nba
          fi
      - name: Bet-Selection V2 (V2-6 PAPER research; 0 credits; never affects the Money Card)
        if: always() && steps.tests.outcome == 'success'
        continue-on-error: true
        env:
          TRIGGER_EVENT: ${{ github.event_name }}
        run: |
          git fetch -q origin master && (git checkout origin/master -- paper_betting_v2/ 2>/dev/null || true)
          if [ "${{ github.event.schedule }}" = "30 22 * * *" ] || [ "${{ inputs.mode }}" = "settle" ]; then
            python scripts/run_bet_selection_v2.py settle
          else
            python scripts/run_bet_selection_v2.py evaluate
          fi
      - name: Commit tennis prediction artefacts
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tennis_predictions/
          for f in predictions reports/latest_prediction_board.json reports/latest_prediction_board.csv reports/latest_prediction_board.md reports/latest_prediction_performance.json paper_betting_v2 reports/bet_selection_v2.json reports/bet_selection_v2.md reports/bet_selection_v2_candidates.csv reports/bet_selection_v2_retrospective.json; do if [ -e "$f" ]; then git add "$f"; fi; done  # V2-5 (per path: absent files cannot break this step)
          if git diff --cached --quiet; then
            echo "No tennis prediction changes"
          else
            git commit -m "Tennis Prediction Board: $(date -u +%F)"
            git pull --rebase
            git push
          fi
      # V2-7 research card shadow (cer-2). RESEARCH ONLY: 0 API credits (no key passed), reads files the board already wrote,
      # writes only research/platform_v2/card_engine_v2_7/prospective/, commits separately AFTER the production commit
      # above, so it cannot block, delay or alter production artefacts. Inert while both flags in
      # config/card_research_shadow.yaml are false (activation needs Fraser's separate approval).
      - name: V2-7 research card shadow (research only; after production commit; config-gated)
        if: always()
        continue-on-error: true
        timeout-minutes: 5
        env:
          RUN_ID: ${{ github.run_id }}
          TRIGGER_EVENT: ${{ github.event_name }}
          TRIGGER_SCHEDULE: ${{ github.event.schedule }}
          PRODUCTION_TESTS: ${{ steps.tests.outcome }}
        run: |
          OUT=research/platform_v2/card_engine_v2_7/prospective
          SETTLE_RUN=0
          if [ "${{ github.event.schedule }}" = "30 22 * * *" ] || [ "${{ inputs.mode }}" = "settle" ]; then SETTLE_RUN=1; fi
          FLAG=logging_enabled; [ "$SETTLE_RUN" = 1 ] && FLAG=settlement_enabled
          if ! python -c "import sys,yaml; sys.exit(0 if yaml.safe_load(open('config/card_research_shadow.yaml'))['$FLAG'] is True else 3)"; then
            echo "card shadow: $FLAG is not true -- inert"; exit 0
          fi
          snap() { { git status --porcelain --untracked-files=all -- . ":(exclude)$OUT"; git diff -- . ":(exclude)$OUT"; } | sha256sum; }
          BEFORE=$(snap)
          rc=0
          if [ "$PRODUCTION_TESTS" != "success" ]; then
            [ "$SETTLE_RUN" = 1 ] || python scripts/run_card_shadow.py record-failure --reason PRODUCTION_TESTS_FAILED_NO_SCAN || true
            rc=1
          elif ! python -m pytest -q -p no:cacheprovider tests_research; then
            [ "$SETTLE_RUN" = 1 ] || python scripts/run_card_shadow.py record-failure --reason RESEARCH_TESTS_FAILED || true
            rc=1
          elif [ "$SETTLE_RUN" = 1 ]; then
            python scripts/run_card_shadow.py settle || rc=$?
          else
            python scripts/run_card_shadow.py log || rc=$?
          fi
          if [ "$(snap)" != "$BEFORE" ]; then
            echo "::error::card shadow changed files outside $OUT -- nothing committed"; exit 1
          fi
          if [ -d "$OUT" ] && [ -n "$(git status --porcelain --untracked-files=all -- "$OUT")" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -- "$OUT"
            git commit -q -m "V2-7 research card shadow: $(date -u +%F) (research only)"
            for i in 1 2 3; do git pull -q --rebase --autostash && git push -q && break; sleep 10; done
          fi
          [ "$rc" = 0 ] || echo "::warning::card shadow research step reported a failure (see scan_runs.csv); production unaffected"
          exit $rc

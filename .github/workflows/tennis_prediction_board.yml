name: tennis_prediction_board

# Phase V2-2 (2026-09-23): PAPER tennis Prediction Board + settlement. Research only --
# no stakes, no Money Card, no bankroll. Protocol:
# research/platform_v2/tennis_prospective/ATP_PROSPECTIVE_PROTOCOL.md
# Credits: /sports is free; 1 credit per active covered tennis key per scan (regions=uk,
# markets=h2h); a guard in the script stops tennis fetches below 150 remaining credits
# so the football scan's budget is protected. Settlement uses free published results.

on:
  schedule:
    - cron: "30 6 * * *"   # morning board (Europe/Asia sessions)
    - cron: "30 15 * * *"  # afternoon board (picks up newly scheduled Americas matches)
    - cron: "30 22 * * *"  # settlement + performance (no API credits)
  workflow_dispatch:
    inputs:
      mode:
        description: "board or settle"
        type: choice
        options: [board, settle]
        default: board

permissions:
  contents: write

concurrency:
  group: prediction-markets-lab-production
  cancel-in-progress: false

jobs:
  tennis:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Record workflow start (V2-5 timing evidence)
        run: echo "WORKFLOW_START=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -e .
      - name: Run the test suite first
        id: tests
        run: pytest -q
      - name: Board
        if: (github.event_name == 'schedule' && github.event.schedule != '30 22 * * *') || (github.event_name == 'workflow_dispatch' && inputs.mode == 'board')
        env:
          THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
          TRIGGER_EVENT: ${{ github.event_name }}
          TRIGGER_SCHEDULE: ${{ github.event.schedule }}
          RUN_ID: ${{ github.run_id }}
        run: python scripts/run_tennis_prediction_board.py
      - name: Settle
        if: (github.event_name == 'schedule' && github.event.schedule == '30 22 * * *') || (github.event_name == 'workflow_dispatch' && inputs.mode == 'settle')
        run: python scripts/run_tennis_settlement.py
      - name: Unified Prediction Board -- tennis mirror + NBA (V2-5 paper; NBA inactive until 2026-10-20)
        if: always() && steps.tests.outcome == 'success'
        continue-on-error: true
        env:
          THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
          TRIGGER_EVENT: ${{ github.event_name }}
          TRIGGER_SCHEDULE: ${{ github.event.schedule }}
        run: |
          git fetch -q origin master && (git checkout origin/master -- predictions/ 2>/dev/null || true)
          python scripts/run_unified_prediction_board.py ingest-tennis --ci-passed
          if [ "${{ github.event.schedule }}" = "30 22 * * *" ] || [ "${{ inputs.mode }}" = "settle" ]; then
            python scripts/run_unified_prediction_board.py settle
          else
            python scripts/run_unified_prediction_board.py collect-nba
          fi
      - name: Commit tennis prediction artefacts
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tennis_predictions/
          for f in predictions reports/latest_prediction_board.json reports/latest_prediction_board.csv reports/latest_prediction_board.md reports/latest_prediction_performance.json; do if [ -e "$f" ]; then git add "$f"; fi; done  # V2-5 (per path: absent files cannot break this step)
          if git diff --cached --quiet; then
            echo "No tennis prediction changes"
          else
            git commit -m "Tennis Prediction Board: $(date -u +%F)"
            git pull --rebase
            git push
          fi

name: prop_price_probe_2

# SECOND AND FINAL prop price probe (approved 2026-10-02, <=2 credits). Push-triggered on this branch only.
# The script pays ONLY if an EPL event kicks off within 1-24 h (preferring 6-12 h) and never again once
# research_shadow/prop_price_probe/probe2/result.json exists. Bot pushes (GITHUB_TOKEN) never re-trigger this.
on:
  push:
    branches: ["probe/prop-price-c2"]

permissions:
  contents: write

concurrency:
  group: prop-price-probe-2
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          pip install -r requirements.txt
          pip install -e .
      - name: Probe tests
        run: pytest -q tests/unit/test_prop_price_probe_2.py
      - name: Probe (pays only inside the pre-registered window; <=2 credits; one-shot)
        env:
          THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
        run: python scripts/prop_price_probe_2.py
      - name: Audit saved response (no network)
        run: |
          if [ -f research_shadow/prop_price_probe/probe2/raw_event_odds.json ]; then
            python scripts/prop_probe_audit.py research_shadow/prop_price_probe/probe2
          fi
      - name: Commit result
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add research_shadow/prop_price_probe/probe2/ 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "Prop price probe 2: $(date -u +%FT%H:%MZ)"
            git push
          fi

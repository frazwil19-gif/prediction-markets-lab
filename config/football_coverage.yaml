# FINAL FOOTBALL COVERAGE (2026-10-01). Design + evidence: research/platform_v2/football_coverage/COVERAGE_DESIGN.md
# Three separate things (never conflated):
#   observe        -- prospective observation (Stage A / unified ledger / decision shadow), credits permitting
#   paper_state    -- ACTIVE: bsv2 may record PAPER_BET rows (frozen bsv2-4 rules); requires first_row_pass (verifier
#                     result reference). PENDING_FIRST_ROW_PASS: approved Tier-1 paper league, rows are recorded as
#                     shadow (never a PAPER_BET) until its own genuine first-row PASS. SHADOW: observation only.
#   real money     -- NOT controlled here: config/competitions.yaml football.money_card_competitions (unchanged)
# PENDING_FIRST_ROW_PASS -> ACTIVE is a recorded state transition: run
#   python scripts/verify_first_rows.py --sport football --competition "<name>"
# on the first genuine rows; on PASS set paper_state: ACTIVE and first_row_pass: "<date> <commit>" in one commit.
# SHADOW -> PENDING needs Fraser's explicit approval. Rows recorded while pending stay shadow forever (append-only).
#
# tier: credit priority. 1 = paper core (only the hard floor stops it), 2 = prospective shadow, 3 = conditional shadow.
#   Tiers 2/3 are throttled automatically by the dynamic floor in config/api_budget.json (football_tiers): Tier 3 first.
# markets: Odds API featured markets paid per call (credits = number of markets). totals only where the legacy V1
#   card already uses them (E0/E1/SC0); O/U 2.5 is REJECTED for strong-prediction use (V2-18) and is not reopened.
# first_row_pass: null, grade_1x2: V2-18 historical grade (research/platform_v2/v2_18_expansion/LEAGUE_SUMMARY.csv); not re-estimated here.

# Active sports and competitions, per project instructions section 4.
# Tier 1 (launch) markets are active; Tier 2 are listed but inactive.

football:
  active: true
  markets:
    - pre_match_1x2
    - over_under_2_5_goals
  competitions:
    - Premier League
    - Championship
    - Scottish Premiership
    - Eredivisie        # V2-19: V2-18 EXPAND NOW (grade A 1X2/DC; settlement aliases added from first observed spellings)
    - Bundesliga        # V2-19: V2-18 EXPAND NOW
    # Final football coverage (2026-10-01): observed prospectively; tier / paper eligibility in config/football_coverage.yaml
    # (shadow leagues never produce a PAPER_BET; none of these is in money_card_competitions).
    - Ligue 1
    - La Liga
    - Serie A
    - Primeira Liga
    - Belgian Pro League
    - League One
    - League Two
    - Segunda Division
    - 2. Bundesliga
    - Serie B
    - Ligue 2
    # Additional competitions may be added only once bookmaker
    # coverage is confirmed strong (section 4).
  # V2-19: the legacy Daily Money Card may money-qualify ONLY these (unchanged pre-V2-19 set). Leagues added by the
  # V2-18 expansion run prospectively / paper-only (Evidence & Promotion Protocol); money needs Fraser's approval.
  money_card_competitions:
    - Premier League
    - Championship
    - Scottish Premiership
  # V2-13 (2026-10-01): listed competitions MUST have an Odds API sport key (ingestion/the_odds_api_loader.py),
  # a settlement mapping (prediction_platform/settle.py COMP_TO_FD) and explicit calibration/coverage support
  # (a test enforces the first two). Disabled until all three exist -- kept here for provenance, never silently deleted:
  disabled_competitions:
    - name: Champions League
      reason: "no Odds API sport key, no football-data settlement mapping, no calibration evidence (V2-12 audit)"
      disabled_on: "2026-10-01"

tennis:
  active: true
  markets:
    - pre_match_match_winner
  avoid_markets:
    - set_betting
    - game_handicaps
    - exact_scores
    - in_play_points
    - obscure_low_liquidity_tournaments

# Tier 2 — future markets. Do not activate until the Tier 1 workflow
# (football + tennis) is proven to work end-to-end (section 4).
basketball:
  active: false
  markets:
    - moneyline

cricket:
  active: false
  markets:
    - match_winner

politics:
  active: false
  markets:
    - major_current_affairs

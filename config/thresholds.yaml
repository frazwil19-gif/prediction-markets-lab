# Opportunity grading thresholds.
# Defaults mirror project instructions, section 10.
#
# grade_c_min_net_ev is not specified explicitly in the project
# instructions (Grade C is described only as "watchlist only"). 0.00 is
# used as a conservative default so that any opportunity with negative
# net EV is rejected outright, and anything with non-negative net EV
# below the Grade B floor is watchlisted rather than discarded. Revisit
# once paper-trading history exists to see whether a different C floor
# is more useful.

grade_a_plus:
  min_net_ev: 0.08          # 8%
  min_probability_edge_pp: 4.0
  min_bookmaker_count: 5
  max_stake_gbp: 0.50

grade_a:
  min_net_ev: 0.05          # 5%
  min_probability_edge_pp: 3.0
  min_bookmaker_count: 4
  max_stake_gbp: 0.25

grade_b:
  min_net_ev: 0.02          # 2%
  max_net_ev: 0.05          # 5% (approximate upper bound before Grade A)

grade_c:
  min_net_ev: 0.00

# --- Added 2026-09-18 (Daily Engine V1 build) ---
# Mechanical data-quality check (decisions/data_quality.py). Replaces the
# Stage-1 manual data_quality_ok judgement for the parts that can be
# checked mechanically (bookmaker count, quote freshness). A human still
# owns no_material_info_risk and market_rules_match separately -- see
# decisions/grading.py.
data_quality:
  min_bookmakers: 3
  max_quote_age_minutes: 240.0

# Confidence heuristic (decisions/confidence.py). NOT a calibrated
# probability-of-being-right score -- see that module's docstring. Purely
# a mechanical flag for thin/disagreeing bookmaker input, to be
# recalibrated once real Daily Card history exists.
confidence:
  high_min_bookmakers: 5
  high_max_std_dev: 0.02
  medium_min_bookmakers: 3
  medium_max_std_dev: 0.05

# --- Added 2026-09-20 (Production Infrastructure Build) ---
# Payout / minimum-odds policy: "high probability + credible high
# confidence + statistical support + meaningful payout + acceptable
# risk," not maximum probability alone. These starting values are the
# operator's own initial experimental configuration -- explicitly NOT
# assumed optimal; performance/odds_bands.py exists so paper-trading and
# the historical backtest can challenge them with real evidence.
payout_policy:
  normal_min_decimal_odds: 1.33
  preferred_min_decimal_odds: 1.40
  preferred_max_decimal_odds: 2.50

# --- Added 2026-09-22 (TARGETED PRODUCTION CHANGE -- DAILY MONEY WINDOW +
# MONEY/PAPER SEPARATION). Fraser's own framing: "high/strong probability +
# credible confidence + statistical support + meaningful payout + acceptable
# value + acceptable risk" -- NOT "highest probability regardless of price"
# and NOT "any positive-EV selection regardless of probability." Every value
# below is the operator's own initial, explicitly-NOT-assumed-optimal
# starting point (see decisions/money_qualification.py's module docstring)
# -- paper-trading and backtest evidence should challenge these, tracked
# prospectively by odds band / probability band, not tuned on a tiny sample.
money_qualification:
  # A candidate may appear on the actionable Daily Money Card only if its
  # kickoff is after the scan timestamp AND within this many hours. Backend/
  # paper research is NOT limited by this horizon -- see run_daily_scan.py.
  event_horizon_hours: 24.0
  # Real-money probability floor for HIGH-confidence candidates.
  min_probability: 0.50
  # A stricter probability floor applied when confidence is only MEDIUM --
  # "potentially eligible only if all other requirements are strong."
  min_probability_medium_confidence: 0.60
  # Value/EV floor for HIGH-confidence candidates. Kept separate from (and
  # in addition to) decisions/grading.py's own net-EV grade thresholds --
  # this project never assumes an actionable research grade alone proves
  # acceptable value for a MONEY bet.
  min_net_ev: 0.02
  # Stricter EV floor for MEDIUM-confidence candidates.
  min_net_ev_medium_confidence: 0.05
  # Confidence labels (decisions/confidence.py) automatically eligible for
  # money qualification, subject to every other gate.
  eligible_confidence_labels: ["High"]
  # Confidence labels conditionally eligible -- only when probability/value
  # clear the stricter *_medium_confidence floors above AND (optionally)
  # odds sit inside the preferred payout_policy range.
  conditional_confidence_labels: ["Medium"]
  require_preferred_odds_band_for_conditional_confidence: true

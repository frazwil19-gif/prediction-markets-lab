# V2-20 Daily Paper Bet Card (pcard-1). Pre-registered in research/platform_v2/v2_20_paper/PREREGISTRATION.md.
# Presentation/accounting only: bsv2-4 still makes every PAPER_BET/WATCH/REJECT decision. Paper only; no money.
rule_version: pcard-1
bet_selection_config: config/bet_selection_v2.yaml      # bankrolls, policies, caps are read from here (no copies)
stage_a_board: reports/latest_stage_a_board.json
candidates: reports/bet_selection_v2_candidates.csv
paper_dir: paper_betting_v2
enrichment_ledger: paper_betting_v2/card_enrichment.csv
outputs:
  card_json: reports/daily_paper_card.json
  card_md: reports/daily_paper_card.md
  dashboard_json: reports/paper_dashboard.json
  dashboard_md: reports/paper_dashboard.md

grades:
  z_grade_a: 1.0        # one standard error (one-sided 84%) -- conventional, fixed before any card
  z_grade_a_plus: 1.645 # one-sided 95% -- conventional, fixed before any card
  a_plus_min_evidence_state: PROSPECTIVE_CALIBRATION_SUPPORTED

# Evidence & Promotion Protocol states (ordered). Changed only by a protocol review commit.
evidence_states_order:
  - HISTORICAL_VALIDATED
  - PROSPECTIVE_SHADOW
  - PROSPECTIVE_CALIBRATION_SUPPORTED
  - PAPER_FINANCIAL_VALIDATION
  - MONEY_ELIGIBLE_CANDIDATE
default_evidence_state: HISTORICAL_VALIDATED
engine_evidence_state:
  atp_match_winner.betfair_market: PROSPECTIVE_SHADOW
  wta_match_winner.betfair_market: PROSPECTIVE_SHADOW
  football_1x2.market_consensus: PROSPECTIVE_SHADOW
  football_double_chance.derived_1x2: PROSPECTIVE_SHADOW
  nba_moneyline.market: HISTORICAL_VALIDATED

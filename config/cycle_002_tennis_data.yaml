# Cycle 2 (Tennis Match Winner) data acquisition configuration.
#
# REWRITTEN 2026-09-11 (source pivot). Original plan used Jeff
# Sackmann's tennis_atp/tennis_wta GitHub repos directly -- confirmed
# via `git ls-remote` (direct to GitHub's git servers, no CDN, no
# cache, no rate limit involved) and the GitHub API that BOTH repos no
# longer exist at that path ("Repository not found", not a branch
# issue, not flakiness). Jeff Sackmann's account and other repos
# (tennis_MatchChartingProject) are still active, so this looks like a
# targeted removal/rename of just these two, not an account-wide
# issue -- reason unconfirmed from outside GitHub.
#
# Replacement, verified against real live fetches before switching
# (never blindly swapped a URL without checking real content first):
# Tennismylife/TML-Database (github.com/Tennismylife/TML-Database),
# explicitly "Based on Jeff Sackmann's work: tennis_atp" per its own
# README -- an actively-maintained continuation using the IDENTICAL
# column schema (tourney_id, winner_name, winner_rank, w_ace, etc.),
# confirmed by directly fetching and inspecting 2021.csv, 2024.csv and
# 2025.csv. Bonus: this schema embeds winner/loser rank, rank_points,
# age, height, hand, and country directly in every match row, so a
# separate rankings/player-bio acquisition step (Sackmann's
# rankings_10s/20s/current.csv, players.csv) is no longer needed for
# this project's stated requirements -- one file per season now
# covers match date/tournament, players, winner/loser, surface, and
# rank-at-time-of-match all at once.
#
# ATP only for this phase: no actively-maintained free WTA equivalent
# was found in a reasonably bounded search (see
# research/cycles/CYCLE_002_TENNIS/PLAN.md's diagnostic-run notes and
# claude/cycle-2-research-pipeline.md). This is a deliberate, reasoned
# descope, not a silent drop -- ATP alone is a complete, 58-year-deep
# tour, sufficient for a real Match Winner research cycle. WTA is
# queued for a follow-up phase if/when a comparable live source turns
# up (re-adding it is a config change, not a redesign -- the loader
# code doesn't hardcode a single tour).
#
# Two independent source families, joined later by player identity,
# not assumed identical at acquisition time:
#   1. Tennismylife/TML-Database -- ATP match results, one CSV per
#      season, with rank/age/hand/height/country embedded per row.
#      License: CC BY-NC-SA (non-commercial only -- see licensing note
#      below).
#   2. Tennis-data.co.uk -- per-year bookmaker/exchange odds files,
#      same publisher and CSV/Excel convention as football-data.co.uk
#      (already used in Cycle 1). Separately confirmed unreliable from
#      three independent networks (a GitHub Actions runner, this
#      project's own web-fetch tooling, and a plain browser-style
#      check) with inconsistent TLS-handshake failures and 503s --
#      treated as a best-effort source with a manual-download fallback,
#      not assumed to always be automatable. See PLAN.md's diagnostic
#      notes for the compatibility measures already attempted.
#
# Cross-source player-name matching (TML-Database's full names vs.
# tennis-data.co.uk's "Djokovic N."-style abbreviated name strings) is
# deliberately NOT done in this acquisition step -- it is a real,
# nontrivial entity-resolution problem in its own right (the tennis
# analogue of football's team-name normalisation) and deserves its own
# checkpoint, not to be rushed inside the acquisition script. See
# research/cycles/CYCLE_002_TENNIS/PLAN.md §4 (Checkpoint 2).

licensing:
  match_data_license: "CC BY-NC-SA"
  match_data_attribution: >-
    ATP match data from Tennismylife/TML-Database
    (github.com/Tennismylife/TML-Database), itself built on Jeff
    Sackmann's tennis_atp work (github.com/JeffSackmann). Licensed CC
    BY-NC-SA. Non-commercial research/paper-trading use only; any
    future commercial or production use requires separate licensing
    review.

sources:
  tml_database_atp:
    base_url: "https://raw.githubusercontent.com/Tennismylife/TML-Database/master"
    tour: "atp"
  tennis_data_co_uk:
    # Documented convention (per public tennis-betting-model
    # references), confirmed reachable in principle -- the acquisition
    # has hit TLS-handshake failures from every automated environment
    # tried so far (see PLAN.md). The acquisition script's
    # schema-inventory step and the validator's zip-magic-number check
    # are both designed to surface a wrong URL pattern loudly (a
    # 404/HTML-error-page rejection, or a missing PK zip header)
    # rather than silently accepting bad data, on whichever attempt
    # (automated or manual) actually gets bytes back.
    base_url: "https://www.tennis-data.co.uk"
    men_path_template: "{year}/{year}.xlsx"
    women_path_template: "{year}w/{year}.xlsx"
  # A descriptive, honest user agent -- not spoofed as a browser (same
  # convention as config/cycle_001_data.yaml).
  user_agent: >-
    PredictionMarketsLab/0.1 (personal research project; see
    docs/DATA_LEAKAGE_RULES.md and
    docs/HISTORICAL_PRICE_AND_CLV_LIMITATIONS.md)

tours:
  - code: ATP
    name: "ATP Tour (men's)"
  # WTA deliberately omitted for this phase -- see the top-of-file note.

# Calendar-year seasons (tennis seasons are Jan-Dec, unlike football's
# Aug-May split), chosen to mirror Cycle 1's 5-season / 1-sealed-holdout
# structure over the same real-world period.
seasons:
  - "2021"
  - "2022"
  - "2023"
  - "2024"
  - "2025"  # provisional sealed holdout -- see split_plan below

tml_database_match_files:
  # One self-contained per-season file per tour: match metadata,
  # players, surface, score, and rank/age/hand/height/country at time
  # of match all in one row. No separate rankings or player-bio files
  # needed (see top-of-file note).
  filename_template: "{season}.csv"

expected_raw_file_count: 10
  # 1 tour (ATP) x 5 seasons match files (5)
  # + 1 tour (ATP) x 5 seasons odds files (5)
  # This is a soft check (a printed warning, not a hard failure).

# Real acquisition runs 2026-09-13 and 2026-09-15 confirmed
# tennis_data_co_uk's HTTPS endpoint fails the TLS handshake for
# EVERY client tried -- a Python/OpenSSL client on a GitHub Actions
# runner (including after bumping to Python 3.12 specifically to pick
# up a documented legacy-TLS mitigation), Anthropic's own separate
# web-fetch infrastructure, and a real, unmodified Chrome browser all
# got a fatal TLS alert during the handshake itself
# ([SSL: TLSV1_ALERT_INTERNAL_ERROR] / Chrome's ERR_SSL_PROTOCOL_ERROR).
# Chrome failing is the deciding signal: browsers tolerate almost any
# legacy server quirk, so if Chrome can't complete the handshake
# either, the server itself is currently broken -- this is not a
# client-compatibility gap any of our tooling (or a manual browser
# download) can work around. Listed here, not assumed forever: retry
# automation periodically in case this is a transient outage, and
# re-validate before ever removing this source family rather than
# assuming the breakage is permanent.
#
# tml_database_match is NOT optional -- TML-Database has fetched
# cleanly on every real run so far and is this project's only source
# for the actual match results the models need; a failure there is a
# real problem worth stopping the run over. tennis_data_co_uk (odds,
# needed later for the market-consensus benchmark, not for Checkpoint
# 1's match data) is the only source family listed here.
optional_source_families:
  - tennis_data_co_uk

pacing:
  request_delay_seconds: 6.0
  max_retries: 4
  initial_backoff_seconds: 10.0
  backoff_multiplier: 2.0
  request_timeout_seconds: 30.0
  # A source already confirmed broken (see optional_source_families
  # above) doesn't deserve the full retry/backoff budget every run --
  # at max_retries=4 each failing file costs up to
  # initial_backoff_seconds * (backoff_multiplier**max_retries - 1) /
  # (backoff_multiplier - 1) =~ 150s, so 5 failing odds files can burn
  # ~12-13 minutes for a known, already-diagnosed outcome. 1 retry
  # (~16s: the 6s inter-request delay plus one 10s backoff) still gives
  # the source a fair, fast chance to have recovered without wasting
  # the run's time restating what's already confirmed. Required
  # sources keep the full max_retries above.
  optional_source_max_retries: 1

validation:
  # Provisional defaults for tennis-data.co.uk's odds columns -- same
  # "known prefixes, confirmed empirically" philosophy as Cycle 1's
  # known_bookmaker_prefixes. Do not treat this list as ground truth
  # until the schema-inventory step (scripts/run_cycle_002_tennis_data_acquisition.py)
  # has actually run against a real download and recorded what was found.
  min_decimal_odds: 1.01
  max_plausible_overround: 0.35
  provisional_known_bookmaker_prefixes: ["B365", "PS", "Max", "Avg", "EX", "LB", "SJ", "UB"]
  min_bookmakers_for_consensus_eligibility: 2
  # Deferred to Checkpoint 2 (name matching) -- listed here only so the
  # threshold is pre-registered rather than invented after seeing data.

schema:
  canonical_schema_version: "tennis_cycle_002_v0.2_acquisition_only_atp_tml_database"

output_paths:
  raw_root: "data/raw/tennis"
  processed_root: "data/processed/tennis"
  samples_root: "data/samples"
  reports_root: "reports/audits"
  manifest_path: "reports/audits/tennis_data_manifest.csv"
  data_version_path: "data/processed/tennis/cycle_002_data_version.json"

split_plan:
  # Provisional -- mirrors Cycle 1's structure. Confirmed only once full
  # acquisition completes and real per-season row counts are known, and
  # only after the Checkpoint 2 name-matching step establishes how many
  # matches actually have usable market data (coverage will likely be
  # lower than TML-Database's raw match count, exactly as football's
  # eligible_consensus_model flag reduced 3,480 -> 3,446).
  training_seasons: ["2021", "2022", "2023"]
  validation_seasons: ["2024"]
  final_test_season: "2025"
